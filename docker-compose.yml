# One container: the Go API (Gin) on :8090, which also serves the static app from ./app.
#   dev  (default): air rebuilds on .go changes; app files are read live from ./app
#   prod: API_TARGET=prod docker compose up -d --build
services:
  api:
    build:
      context: ./api
      target: ${API_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:8090"
    # Values come from .env (compose reads it for ${…} automatically). Only what the API needs is passed in.
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: "8090"
      APP_DIR: /srv/app
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
      GOFLAGS: -buildvcs=false
    volumes:
      - ./app:/srv/app:ro
      - ./api:/src                     # dev: source for air (unused by the prod image)
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      # Service account JSON stays outside the repo and the image. /dev/null if unset, so the API refuses to start with a clear message.
      - ${SERVICE_ACCOUNT_PATH:-/dev/null}:/run/secrets/service-account.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gomod:
  gocache:
